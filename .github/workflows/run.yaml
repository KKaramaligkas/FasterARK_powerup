name: FasterARK
on:
  push:
    branches:
      - main
      - themes-fixes
    tags:
      - 'ARK-*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
env:
  PSPDEV: /usr/local/pspdev
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Dependencies
        run: |
          sudo apt-get install git openssh-client clang automake autoconf zlib1g-dev python3 python3-pycryptodome python3-ecdsa p7zip-full curl unzip sudo mkisofs

      - name: Getting lastest pspdev
        run: | 
          curl -OJL 'https://github.com/pspdev/pspdev/releases/latest/download/pspdev-ubuntu-latest-x86_64.tar.gz'
          sudo tar xvf pspdev-ubuntu-latest-x86_64.tar.gz -C /usr/local/
          echo $PSPDEV/bin >> $GITHUB_PATH
          echo PATH="$PATH:$PSPDEV/bin"

      - name: Cloning and Building lastest pspsdk
        run: | 
          git clone https://github.com/pspdev/pspsdk

      - name: Bootstrap sdk and build
        working-directory: pspsdk
        run: |
          bash ./bootstrap
          ./configure
          make
          make install

      - name: ya2d via psp-pacman
        run: |
          psp-pacman -Syyu --noconfirm
          psp-pacman -S ya2d --noconfirm

      - name: Plugin Manager libraries via psp-pacman
        run: psp-pacman -S --needed curl mbedtls cjson unarr libintrafont libpng zlib bzip2 liblzma --noconfirm

      - name: Update psp-cfw-sdk
        run: curl -OJL "https://github.com/pspdev/psp-cfw-sdk/releases/download/latest/psp-cfw-sdk.zip"
      
      - name: Extract psp-cfw-sdk
        run: sudo unzip -o psp-cfw-sdk.zip -d /

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: ARK version
        id: version
        run: |
          # "5.1.2", or "5.1.1k" with a suffix, from Updater/version.h
          v=$(awk '/#define ARK_(MAJOR|MINOR|MICRO)_VERSION/ { printf "%s%s", sep, $3; sep = "." }' Updater/version.h)
          s=$(sed -n 's/^#define ARK_VERSION_SUFFIX "\(.*\)"/\1/p' Updater/version.h)
          echo "version=$v$s" >> "$GITHUB_OUTPUT"


      - name: Clone VitaSDK
        run: |
         git clone https://github.com/vitasdk/vdpm

      - name: Bootstrap VitaSDK
        working-directory: vdpm
        run: |
          echo VITASDK=/usr/local/vitasdk >> $GITHUB_ENV
          echo /usr/local/vitasdk/bin >> $GITHUB_PATH
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          ./bootstrap-vitasdk.sh
          # install-all.sh goes through vdpm's repo-root script, which still looks for
          # pacman in $VITASDK/bin; use the SDK's own vdpm and only what PSVita links
          VDPM_NONINTERACTIVE=1 vdpm install zlib libpng libjpeg-turbo libvita2d taihen

      - name:  mkpsxiso
        run: |
          curl -OJL 'https://github.com/Lameguy64/mkpsxiso/releases/download/v2.20/mkpsxiso-2.20-Linux.deb'
          sudo apt-get install ./mkpsxiso-2.20-Linux.deb

      - name: Build
        run:  make clean && make 

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: FasterARK-release
          path: dist/*
  release:
    needs: build
    # other branches and pull requests only build; releasing takes a push to main or an explicit ARK-* tag
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/ARK-')
    runs-on: ubuntu-latest
    steps:
      - name: Release name
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            # main releases the version in Updater/version.h, once: bump it to release again
            tag="ARK-$VERSION"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "$tag is already released"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag/-/ }" >> "$GITHUB_OUTPUT"
      - name: Download artifacts
        if: steps.meta.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: FasterARK-release
          path: dist/*.zip
      - name:
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: |
            **/*.zip
            **/*.vpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
