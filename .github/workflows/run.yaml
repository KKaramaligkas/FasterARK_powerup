name: FasterARK
on:
  push:
    branches:
      - main
      - themes-fixes
    tags:
      - 'ARK-*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PSPDEV: /usr/local/pspdev
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcjson-dev libunarr-dev libmbedtls-dev zlib1g-dev libcurl4-openssl-dev openssl libgnutls28-dev lftp
      - name: Sanitized core and recovery tests
        env:
          UBSAN_OPTIONS: halt_on_error=1
        # against the store installed copies download, not the app repository's copy
        run: make -C PluginManager/app/tests check SEED="$PWD/PluginManager/store/store.json"
      - name: Sanitized browser and TLS policy tests
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: make -C Flow/tests check
      - name: Sanitized launcher FTP server tests
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: make -C Launcher/ftpd/tests check
      - name: Validate toolchain lock
        run: |
          python3 tools/ci_toolchains.py check
          python3 -m unittest discover -s tools/tests
          python3 tools/check_store_downloads.py PluginManager/store/store.json
  build:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Locked toolchain settings
        run: python3 tools/ci_toolchains.py env >> "$GITHUB_ENV"
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssh-client clang automake autoconf zlib1g-dev python3 python3-pycryptodome python3-ecdsa p7zip-full curl unzip sudo mkisofs

      - name: Install locked pspdev
        run: | 
          python3 tools/ci_toolchains.py download pspdev pspdev.tar.gz
          sudo tar xf pspdev.tar.gz -C /usr/local/
          echo $PSPDEV/bin >> $GITHUB_PATH
          echo PATH="$PATH:$PSPDEV/bin"

      - name: Fetch locked pspsdk
        run: | 
          git init pspsdk
          git -C pspsdk remote add origin https://github.com/pspdev/pspsdk
          git -C pspsdk fetch --depth 1 origin "$PSPSDK_REF"
          git -C pspsdk checkout --detach FETCH_HEAD

      - name: Bootstrap sdk and build
        working-directory: pspsdk
        run: |
          bash ./bootstrap
          ./configure
          make
          make install

      - name: ya2d via psp-pacman
        run: |
          psp-pacman -Syy --noconfirm
          psp-pacman -S ya2d --noconfirm

      - name: Plugin Manager libraries via psp-pacman
        run: psp-pacman -S --needed curl mbedtls cjson unarr libintrafont libpng zlib bzip2 liblzma --noconfirm

      - name: Custom Launcher libraries via psp-pacman
        run: psp-pacman -S --needed libpspav libpspftp libpspvram libpspmath --noconfirm

      - name: Update psp-cfw-sdk
        run: python3 tools/ci_toolchains.py download psp_cfw_sdk psp-cfw-sdk.zip
      
      - name: Extract psp-cfw-sdk
        run: sudo unzip -o psp-cfw-sdk.zip -d /

      - name: ARK version
        id: version
        run: |
          # "5.1.2", or "5.1.1k" with a suffix, from Updater/version.h
          v=$(awk '/#define ARK_(MAJOR|MINOR|MICRO)_VERSION/ { printf "%s%s", sep, $3; sep = "." }' Updater/version.h)
          s=$(sed -n 's/^#define ARK_VERSION_SUFFIX "\(.*\)"/\1/p' Updater/version.h)
          echo "version=$v$s" >> "$GITHUB_OUTPUT"


      - name: Clone VitaSDK
        run: |
         git init vdpm
         git -C vdpm remote add origin https://github.com/vitasdk/vdpm
         git -C vdpm fetch --depth 1 origin "$VDPM_REF"
         git -C vdpm checkout --detach FETCH_HEAD

      - name: Bootstrap VitaSDK
        working-directory: vdpm
        run: |
          echo VITASDK=/usr/local/vitasdk >> $GITHUB_ENV
          echo /usr/local/vitasdk/bin >> $GITHUB_PATH
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          ./bootstrap-vitasdk.sh
      - name: Locked Vita libraries
        run: |
          for package in zlib libpng libjpeg_turbo libvita2d taihen; do
            python3 tools/ci_toolchains.py download "vita_$package" "vita-$package.tar.xz"
            sudo python3 tools/ci_toolchains.py vita-library "vita-$package.tar.xz" "$VITASDK"
          done

      - name:  mkpsxiso
        run: |
          python3 tools/ci_toolchains.py download mkpsxiso mkpsxiso-2.20-Linux.deb
          sudo apt-get install ./mkpsxiso-2.20-Linux.deb

      - name: Build
        run:  make clean && make 

      - name: Build provenance
        run: |
          mkdir -p dist
          cp tools/toolchains.json dist/toolchains.json
          psp-pacman -Q > dist/psp-packages.txt
          psp-gcc --version > dist/compiler-versions.txt
          arm-vita-eabi-gcc --version >> dist/compiler-versions.txt
          git rev-parse HEAD > dist/source-commit.txt
          sha256sum dist/*.zip dist/*.vpk > dist/SHA256SUMS
          python3 tools/release_store.py --artifacts dist --output dist/store.json
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FasterARK-release
          path: dist/*
  release:
    needs: [test, build]
    permissions:
      contents: write
    # other branches and pull requests only build; releasing takes a push to main or an explicit ARK-* tag
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/ARK-')
    runs-on: ubuntu-latest
    steps:
      - name: Release name
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            # main releases the version in Updater/version.h, once: bump it to release again
            tag="ARK-$VERSION"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
              echo "$tag is already released"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag/-/ }" >> "$GITHUB_OUTPUT"
      - name: Download artifacts
        if: steps.meta.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: FasterARK-release
          path: dist
      - name:
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: |
            **/*.zip
            **/*.vpk
            dist/SHA256SUMS
            dist/toolchains.json
            dist/psp-packages.txt
            dist/compiler-versions.txt
            dist/source-commit.txt
            dist/store.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
