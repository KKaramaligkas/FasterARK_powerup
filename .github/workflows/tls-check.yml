# Diagnostic only (not for main): captures the certificate chains GitHub serves
# to the Plugin Manager and commits them here, so they can be checked with the
# PSP build of mbedTLS.
name: TLS check
on:
  push:
    branches:
      - claude/cool-cray-pvgxu5
permissions:
  contents: write
jobs:
  tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture certificate chains
        run: |
          mkdir -p diag/chains
          date -u > diag/chains/captured_at.txt
          for h in raw.githubusercontent.com github.com release-assets.githubusercontent.com objects.githubusercontent.com; do
            openssl s_client -connect $h:443 -servername $h -showcerts </dev/null 2>/dev/null | awk '/BEGIN CERT/,/END CERT/' > diag/chains/$h.pem
            openssl s_client -connect $h:443 -servername $h -showcerts -tls1_2 -sigalgs 'RSA-PSS+SHA256:RSA+SHA256:RSA+SHA384' </dev/null 2>/dev/null | awk '/BEGIN CERT/,/END CERT/' > diag/chains/$h.rsa.pem
            echo "$h: $(grep -c 'BEGIN CERT' diag/chains/$h.pem) certificates, RSA-only client: $(grep -c 'BEGIN CERT' diag/chains/$h.rsa.pem)"
          done
      - name: Commit the chains
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/chains
          git commit -q -m "Diagnostic: certificate chains captured $(date -u +%F)"
          git push -q
